name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -c "import app.main"
        env:
          JWT_SECRET: ci-only-secret-not-used-in-prod-000000000000
          ENCRYPTION_KEY: ci-only-key-not-used-in-prod-00000000000000
      - run: pytest -v
        env:
          JWT_SECRET: ci-only-secret-not-used-in-prod-000000000000
          ENCRYPTION_KEY: ci-only-key-not-used-in-prod-00000000000000
      # continue-on-error: CVE conhecida sem correcao upstream (ecdsa/python-jose, ver
      # comentario em requirements.txt) nao pode quebrar o build -- isso so avisa no log.
      - run: pip install pip-audit -q && pip-audit -r requirements.txt
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images (sem subir containers)
        run: docker compose build
